            2ce2ff952e150baf28a29cda70a363b0340b3e81a55f43e51ec5edffc3d066c1 \
            "$RUNNER_TEMP/detekt.jar" | sha256sum --check

      - name: Detekt futtatasa
        shell: bash
        run: |
          set +e
          java -jar "$RUNNER_TEMP/detekt.jar" \
            --input app/src/main/java \
            --base-path "$GITHUB_WORKSPACE" \
            --language-version 1.6 --jvm-target 1.8 \
            --report html:reports/detekt.html \
            --report xml:reports/detekt.xml \
            --report sarif:reports/detekt.sarif \
            2>&1 | tee reports/detekt-console.txt
          result=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$result" > reports/detekt-exit-code.txt
          if [[ "$result" -ne 0 && "$result" -ne 2 ]]; then
            exit "$result"
          fi

      - name: Detekt riportok mentese
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: detekt-eredmenyek
          path: reports/
          retention-days: 90

  android-lint:
    name: Android Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Android SDK elokeszitese
        shell: bash
        run: |
          mkdir -p reports
          git rev-parse HEAD > reports/commit.txt
          date -u > reports/run-date.txt
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-32" "build-tools;30.0.3" \
            2>&1 | tee reports/sdk-setup.txt

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '11'

      - name: Android Lint futtatasa
        shell: bash
        run: |
          java -version 2> reports/java-version.txt
          chmod +x gradlew
          set +e
          ./gradlew --no-daemon --console=plain :app:lintDebug \
            2>&1 | tee reports/android-lint-console.txt
          result=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$result" > reports/android-lint-exit-code.txt
          exit "$result"

      - name: Android Lint riportok mentese
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-lint-eredmenyek
          path: |
            reports/
            app/build/reports/lint-results*
          retention-days: 90
